<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SciScreen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>SciScreen</h1>
  <p class="subtitle">AI-assisted literature screening with restart-safe PubMed + LLM pipeline.</p>

  <section class="panel">
    <div class="row">
      <label>Search name <input id="search-name" placeholder="my_search" /></label>
      <label>PubMed query <input id="search-query" placeholder="optogenetics primate" /></label>
      <label>Entrez email <input id="search-email" placeholder="you@example.com" /></label>
      <button id="create-search">Create Search</button>
    </div>

    <div class="row actions">
      <button id="btn-search">SEARCH PUBMED</button>
      <button id="btn-fetch">FETCH ABSTRACTS</button>
      <button id="btn-run-all">RUN SciScreen (all unprocessed)</button>
      <button id="btn-run-selected">RUN SciScreen (selected records)</button>
      <button id="btn-stop" class="danger">STOP ACTIVE JOB</button>
    </div>

    <div class="row">
      <label>Selected row numbers (comma-separated) <input id="selected-rows" placeholder="1,4,12" /></label>
      <label>Active search
        <select id="active-search"></select>
      </label>
      <button id="refresh">Refresh</button>
    </div>

    <div id="progress-wrap">
      <div id="progress-text">Idle</div>
      <progress id="progress" value="0" max="100"></progress>
    </div>
  </section>

  <section class="panel">
    <div class="status-grid">
      <div>Total: <strong id="s-total">0</strong></div>
      <div>Abstract fetched: <strong id="s-abstract">0</strong></div>
      <div>Processed: <strong id="s-processed">0</strong></div>
    </div>
  </section>

  <section class="panel">
    <table id="records-table">
      <thead>
        <tr>
          <th data-sort="row">#</th>
          <th>Select</th>
          <th data-sort="title">Title</th>
          <th data-sort="abstract_fetched">Abstract fetched status</th>
          <th data-sort="processed">LLM run status</th>
          <th data-sort="include">Include decision</th>
          <th data-sort="confidence">Confidence score</th>
          <th data-sort="species">Species</th>
          <th data-sort="direct_quotes">Literal evidence quotes</th>
          <th data-sort="processed">Processed flag</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
